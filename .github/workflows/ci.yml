name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fonts for spine rendering
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-core
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: pytest -q
      - name: Front-end syntax
        run: node --check src/tbr_shelf/static/app.js
